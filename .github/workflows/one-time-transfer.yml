name: one-time-artifact-to-release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source workflow run ID'
        required: true
      tag:
        description: 'Release tag'
        required: true
permissions:
  contents: write
jobs:
  transfer:
    runs-on: windows-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: torgy-windows-update
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./artifact
      - name: Upload to release
        shell: powershell
        run: |
          $f = Get-ChildItem ./artifact -Recurse -Filter "TruCalenZer_0.6.0-beta_x64-setup.exe" | Select-Object -First 1
          if (-not $f) { throw "Installer not found" }
          Write-Host "Uploading $($f.FullName) ($([math]::Round($f.Length/1MB,1)) MB)"
          gh release upload ${{ inputs.tag }} $f.FullName --repo TruJ0e/Torgy-Releases --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
