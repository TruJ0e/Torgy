name: Inspect TruTrol core registration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-trutrol-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, torgy-windows]
    timeout-minutes: 10
    steps:
      - name: Inspect sanitized core registration state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'TruTrol'),
            (Join-Path $env:LOCALAPPDATA 'OpenCommander')
          )
          $root = $roots | Where-Object { Test-Path (Join-Path $_ 'current\dist\cli\commander.js') } | Select-Object -First 1
          if (-not $root) { throw 'No installed TruTrol runtime found.' }
          $app = Join-Path $root 'current'
          $configDir = Join-Path $root 'data'
          $configPath = Join-Path $configDir 'config.json'
          $cli = Join-Path $app 'dist\cli\commander.js'
          Write-Host "InstallRoot=$root"

          $probe = Join-Path $env:RUNNER_TEMP 'trutrol-core-probe.mjs'
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          const app = process.argv[2];
          const configPath = process.argv[3];
          const mod = await import(pathToFileURL(path.join(app, 'dist/core/protected-config.js')).href);
          const loaded = mod.loadProtectedConfig(configPath).config;
          const agent = loaded.agent;
          const gateway = loaded.gateway;
          const matches = (gateway.deviceKeys || []).filter((d) => d.deviceId === agent.deviceId && d.key === agent.deviceKey);
          const sameId = (gateway.deviceKeys || []).filter((d) => d.deviceId === agent.deviceId);
          console.log(`AgentDeviceId=${agent.deviceId}`);
          console.log(`AgentAlias=${agent.deviceAlias || ''}`);
          console.log(`AgentGatewayUrl=${agent.gatewayUrl}`);
          console.log(`AgentPublicEnrollment=${agent.publicEnrollment === true}`);
          console.log(`GatewayHost=${gateway.host}`);
          console.log(`GatewayPort=${gateway.port}`);
          console.log(`GatewayDeviceIdCount=${sameId.length}`);
          console.log(`AgentCredentialMatchesLegacyGateway=${matches.length === 1}`);
          console.log(`GatewayDeviceKeyCount=${(gateway.deviceKeys || []).length}`);
          const publicPlugin = gateway.publicPlugin;
          console.log(`PublicPluginEnabled=${publicPlugin?.enabled === true}`);
          let publicDeviceCount = 0;
          let publicDeviceSameIdCount = 0;
          let publicCredentialMatches = false;
          let publicDeviceClaimed = false;
          if (publicPlugin?.dataDirectory) {
            const authPath = path.join(publicPlugin.dataDirectory, 'public-auth.json');
            if (fs.existsSync(authPath)) {
              const state = JSON.parse(fs.readFileSync(authPath, 'utf8'));
              const devices = Array.isArray(state.devices) ? state.devices : [];
              publicDeviceCount = devices.length;
              const same = devices.filter((d) => d.deviceId === agent.deviceId);
              publicDeviceSameIdCount = same.length;
              const hash = crypto.createHash('sha256').update(agent.deviceKey, 'utf8').digest('base64url');
              publicCredentialMatches = same.some((d) => d.credentialHash === hash);
              publicDeviceClaimed = same.some((d) => typeof d.tenantId === 'string' && d.tenantId.length > 0);
            }
          }
          console.log(`PublicAuthDeviceCount=${publicDeviceCount}`);
          console.log(`PublicAuthSameDeviceIdCount=${publicDeviceSameIdCount}`);
          console.log(`AgentCredentialMatchesPublicStore=${publicCredentialMatches}`);
          console.log(`PublicDeviceClaimed=${publicDeviceClaimed}`);
          '@ | Set-Content -LiteralPath $probe -Encoding UTF8
          & node $probe $app $configPath
          if ($LASTEXITCODE -ne 0) { throw 'Protected-config registration probe failed.' }
          Remove-Item -LiteralPath $probe -Force -ErrorAction SilentlyContinue

          $entrypoint = [IO.Path]::GetFullPath($cli)
          $nodes = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" -ErrorAction SilentlyContinue | Where-Object {
            $_.CommandLine -and $_.CommandLine.IndexOf($entrypoint, [StringComparison]::OrdinalIgnoreCase) -ge 0
          })
          Write-Host "TruTrolNodeProcessCount=$($nodes.Count)"
          foreach ($p in $nodes) {
            $mode = if ($p.CommandLine -match '\sall(?:\s|$)') { 'all' } elseif ($p.CommandLine -match '\sagent(?:\s|$)') { 'agent' } elseif ($p.CommandLine -match '\sgateway(?:\s|$)') { 'gateway' } else { 'unknown' }
            Write-Host "TruTrolProcess:pid=$($p.ProcessId):parent=$($p.ParentProcessId):mode=$mode"
          }

          $lockDir = Join-Path $env:TEMP 'trutrol-agent-locks'
          $locks = if (Test-Path $lockDir) { @(Get-ChildItem -LiteralPath $lockDir -Filter '*.lock' -File -ErrorAction SilentlyContinue) } else { @() }
          Write-Host "OwnershipLockCount=$($locks.Count)"
          foreach ($lock in $locks) {
            try {
              $r = Get-Content -LiteralPath $lock.FullName -Raw | ConvertFrom-Json
              $alive = $false
              try { Get-Process -Id ([int]$r.pid) -ErrorAction Stop | Out-Null; $alive = $true } catch {}
              Write-Host "OwnershipLock:pid=$($r.pid):alive=$alive"
            } catch {
              Write-Host 'OwnershipLock:unreadable=true'
            }
          }

          $statusRaw = @(& node $cli status --config-dir $configDir 2>&1)
          Write-Host "GatewayStatusExit=$LASTEXITCODE"
          if ($LASTEXITCODE -eq 0) {
            try {
              $status = (($statusRaw -join [Environment]::NewLine) | ConvertFrom-Json)
              $devices = @($status.devices)
              Write-Host "GatewayConnectedDeviceCount=$($devices.Count)"
              foreach ($d in $devices) { Write-Host "GatewayDevice:id=$($d.id):alias=$($d.alias):name=$($d.name)" }
            } catch { Write-Host 'GatewayStatusParseFailed=true' }
          }

          foreach ($url in @('https://commander.trujoedigital.com/health','https://commander.trujoedigital.com/ready')) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              Write-Host "PublicEndpoint:$url:status=$([int]$response.StatusCode)"
              try {
                $body = $response.Content | ConvertFrom-Json
                if ($null -ne $body.connectedDevices) { Write-Host "PublicEndpointConnectedDevices=$($body.connectedDevices)" }
                if ($null -ne $body.ready) { Write-Host "PublicEndpointReady=$($body.ready)" }
                if ($null -ne $body.reason) { Write-Host "PublicEndpointReason=$($body.reason)" }
              } catch {}
            } catch {
              $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
              Write-Host "PublicEndpoint:$url:status=$code:error=true"
            }
          }
