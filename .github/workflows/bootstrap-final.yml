name: Finalize source import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore remaining source files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-final/part-*.b64 > /tmp/torgy-remain.b64
          base64 -d /tmp/torgy-remain.b64 > /tmp/torgy-remain.tgz
          echo "dde078261f695925b1d7f0a4780f7a6e7f2b4dc01fbe18e331505f68b0d82cac  /tmp/torgy-remain.tgz" | sha256sum -c -
          tar -xzf /tmp/torgy-remain.tgz -C .
          rm -rf .bootstrap-final
          rm -f .github/workflows/bootstrap-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete Torgy 0.4.0 source import"
            git push
          fi
