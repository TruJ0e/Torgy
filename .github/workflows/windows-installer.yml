name: windows-installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

concurrency:
  group: torgy-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: torgy-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release preflight
        run: node scripts/release-preflight.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Verify public release is generic
        shell: powershell
        run: |
          $defaults = Get-Content 'src-tauri/deployment.defaults.json' -Raw | ConvertFrom-Json
          $configured = $defaults.PSObject.Properties | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Value) }
          if ($configured) {
            throw ('Public release build contains organization-specific defaults: ' + (($configured.Name) -join ', '))
          }
          Write-Host 'Public release defaults are generic; no organization-specific configuration will be embedded.'
      - name: Repository secret/data safety check
        run: npm run security:repo
      - name: Test core logic
        run: npm test
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer
        run: npm run desktop:build
      - name: Upload Windows release payload
        uses: actions/upload-artifact@v4
        with:
          name: torgy-windows-update
          path: |
            src-tauri/target/release/torgy.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
