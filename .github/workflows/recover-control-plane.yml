name: Recover TruTrol control plane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, torgy-windows]
    timeout-minutes: 5
    steps:
      - name: Probe recovery runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Recovery host: $env:COMPUTERNAME"
          $login = (gh api user --jq .login).Trim()
          if ($login -ne 'TruJ0e') { throw "Unexpected GitHub CLI identity: $login" }
          Write-Host "Torgy recovery runner is alive as $login."
