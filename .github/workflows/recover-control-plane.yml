name: Recover TruTrol control plane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-control-plane.yml'
      - 'scripts/recover-control-plane.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-trutrol-control-plane
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, torgy-windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Parse recovery script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\recover-control-plane.ps1'
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Restore Commander TAOS and TruTrol ownership
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\recover-control-plane.ps1'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File $script
          if ($LASTEXITCODE -ne 0) { throw "Control-plane recovery exited $LASTEXITCODE" }
