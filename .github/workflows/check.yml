name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_hosted_rust:
        description: 'Run native Rust certification on paid GitHub-hosted Windows'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: torgy-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: false
    runs-on: torgy-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release preflight
        run: node scripts/release-preflight.mjs
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run security:repo
      - run: npm run core:check
      - run: npm test
      - run: npm run build
      - name: Install recovered Codex web app
        run: npm run web:install
      - name: Verify recovered Codex web app
        env:
          TZ: America/Chicago
        run: |
          npm run web:typecheck
          npm run web:test
          npm run web:build

  rust-static:
    if: false
    runs-on: torgy-windows
    steps:
      - uses: actions/checkout@v4
      - name: Expose Git Bash to Rust toolchain action
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBin = 'C:\Program Files\Git\bin'
          $gitUsrBin = 'C:\Program Files\Git\usr\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBin 'bash.exe'))) {
            throw 'Git Bash is required by the Rust toolchain action but was not found.'
          }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path -LiteralPath $gitUsrBin) {
            $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Validate Rust metadata
        shell: powershell
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | Out-Null
      - name: Validate Rust formatting and parseability
        shell: powershell
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  # Desktop Windows App Control blocks Cargo's unsigned generated build-script
  # executables. Native compile/test remains available, but only after an explicit
  # workflow-dispatch opt-in so a routine manual run cannot consume hosted minutes.
  rust-native-certification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_rust == true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
