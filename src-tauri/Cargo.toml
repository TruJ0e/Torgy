[package]
name = "torgy"
version = "0.4.0"
description = "Local-first academic coordination desktop application"
authors = ["Torgy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "torgy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "torgy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
webbrowser = "1"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
